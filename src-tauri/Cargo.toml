[package]
name = "kiosco-pos"
version = "0.1.0"
description = "Sistema POS offline-first para kioscos argentinos"
authors = ["vos"]
edition = "2021"

[lib]
name = "kiosco_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"
tiny_http = "0.12"
# ARCA / Facturación electrónica
# openssl = { version = "0.10", features = ["vendored"] }  # requiere Strawberry Perl — activar cuando esté instalado
ureq = { version = "2.10", features = ["tls"] }
quick-xml = { version = "0.36", features = ["serialize"] }
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
