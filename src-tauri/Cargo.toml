[package]
name = "kiosco-pos"
version = "0.1.0"
description = "Sistema POS offline-first para kioscos argentinos"
authors = ["vos"]
edition = "2021"

autobins = false

[lib]
name = "kiosco_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# La app de escritorio de siempre (lo que arma `npm run tauri build`).
[[bin]]
name = "kiosco-pos"
path = "src/main.rs"
required-features = ["desktop"]

# Versión web: el mismo sistema, servido por internet, una base por comercio.
# Se corre con: cargo run --release --no-default-features --features server --bin mercalin-web
[[bin]]
name = "mercalin-web"
path = "src/bin/web.rs"
required-features = ["server"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-updater", "dep:tauri-plugin-process", "dep:tauri-plugin-opener"]
server = ["dep:axum", "dep:tokio", "dep:tower-http", "dep:aes-gcm"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
parking_lot = "0.12"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
tiny_http = "0.12"
# ARCA / Facturación electrónica
openssl = { version = "0.10", features = ["vendored"] }
ureq = { version = "2.10", features = ["tls"] }
quick-xml = { version = "0.36", features = ["serialize"] }
base64 = "0.22"
tauri-plugin-updater = { version = "2.10.1", optional = true }
tauri-plugin-process = { version = "2.3.1", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
rand = "0.8"
# Solo para la versión web (feature "server")
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"], optional = true }
tower-http = { version = "0.5", features = ["fs"], optional = true }
aes-gcm = { version = "0.10", optional = true }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
