name: Publicar actualización

# Se dispara al pushear un tag de versión (ej: git tag v1.1.11 && git push origin v1.1.11).
# Compila el instalador de Windows y lo firma (tauri-action).
#
# NO publica como GitHub Release: en este repo, crear una Release (con tauri-action,
# con softprops/action-gh-release, y hasta con el propio `gh` CLI, con o sin el tag
# pusheado de antemano, con o sin reglas de protección de tags -- se descartaron
# todas esas causas) falla siempre igual, sin error visible: queda como
# "untagged-xxxxx" o directamente no se crea. No se encontró la causa de fondo.
#
# En cambio, los archivos (instalador + latest.json) se publican pusheando --force
# a la rama "dist" (sin guardar historial, siempre solo el último build), y el
# updater de la app los lee directo de raw.githubusercontent.com. Un `git push` a
# una rama es la única operación de este pipeline que nunca falló en ~10 intentos.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Leer versión de tauri.conf.json
        id: version
        shell: pwsh
        run: |
          $conf = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          "version=$($conf.version)" >> $env:GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LICENSE_SECRET: ${{ secrets.LICENSE_SECRET }}
        with:
          projectPath: .

      # Arma a mano el manifiesto que el updater de la app consulta
      # (ver src/stores/updater.ts / tauri.conf.json > plugins.updater.endpoints).
      - name: Generar latest.json
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $exeSig = (Get-Content "src-tauri/target/release/bundle/nsis/Mercalin_${version}_x64-setup.exe.sig" -Raw).Trim()
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $manifest = [ordered]@{
            version   = $version
            notes     = "Mercalin v${version}"
            pub_date  = $pubDate
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $exeSig
                url       = "https://raw.githubusercontent.com/${{ github.repository }}/dist/Mercalin_${version}_x64-setup.exe"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path "latest.json" -Encoding utf8

      - name: Publicar en la rama dist
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          rm -rf /tmp/dist-publish
          mkdir -p /tmp/dist-publish
          cp "src-tauri/target/release/bundle/nsis/Mercalin_${version}_x64-setup.exe" /tmp/dist-publish/
          cp "src-tauri/target/release/bundle/nsis/Mercalin_${version}_x64-setup.exe.sig" /tmp/dist-publish/
          cp "src-tauri/target/release/bundle/msi/Mercalin_${version}_x64_en-US.msi" /tmp/dist-publish/
          cp "src-tauri/target/release/bundle/msi/Mercalin_${version}_x64_en-US.msi.sig" /tmp/dist-publish/
          cp "latest.json" /tmp/dist-publish/
          # Nombre estable además del versionado -- así el link de descarga de la
          # web (mercalinonline-web) no se rompe con cada release nueva.
          cp "src-tauri/target/release/bundle/nsis/Mercalin_${version}_x64-setup.exe" /tmp/dist-publish/Mercalin-setup.exe
          cd /tmp/dist-publish
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Mercalin v${version}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:dist
