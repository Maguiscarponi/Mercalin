name: Publicar actualización

# Se dispara al subir un tag de versión (ej: git tag v1.0.1 && git push origin v1.0.1).
# Compila el instalador de Windows y lo firma con la clave de actualizaciones (tauri-action).
# La creación de la release y la subida de archivos las hace un paso aparte
# (softprops/action-gh-release) -- tauri-action venía fallando en silencio al crear
# la release él mismo: el job terminaba en verde pero la release nunca se creaba,
# sin ningún mensaje de error en el log. Separar "compilar" de "publicar" y usar una
# acción distinta y más probada para lo segundo evita ese fallo. También hace falta
# el permiso "Read and write permissions" en Settings > Actions > General del repo
# (el default de solo lectura hacía que cualquier escritura fallara en silencio) y
# fetch-depth: 0 en el checkout, y target_commitish explícito en el paso de abajo --
# el tag recién pusheado tarda unos segundos en ser "descubierto" por el backend de
# Releases de GitHub, y sin decirle a qué commit apunta, cae en crear la release
# como "untagged-xxxxx" en vez de con el tag real.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      # Solo compila y firma -- sin tagName/releaseName/releaseId no intenta crear
      # ni subir ninguna release, así que la firma no depende de esa parte.
      - uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LICENSE_SECRET: ${{ secrets.LICENSE_SECRET }}
        with:
          projectPath: .

      # Arma a mano el manifiesto que el updater de la app consulta
      # (ver src/stores/updater.ts) -- mismo formato que generaba tauri-action.
      - name: Generar latest.json
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $exeSig = (Get-Content "src-tauri/target/release/bundle/nsis/Mercalin_${version}_x64-setup.exe.sig" -Raw).Trim()
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $manifest = [ordered]@{
            version   = $version
            notes     = "Mercalin ${{ github.ref_name }}"
            pub_date  = $pubDate
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $exeSig
                url       = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Mercalin_${version}_x64-setup.exe"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path "latest.json" -Encoding utf8

      # El tag ya existe (es lo que disparó este workflow) pero el backend de
      # Releases de GitHub a veces tarda en "verlo" -- softprops/action-gh-release
      # reintenta solo 2 veces, casi sin pausa, e insuficiente. Acá esperamos de
      # verdad, consultando la API hasta que confirme el tag antes de seguir.
      - name: Esperar a que el tag sea visible para la API de Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          for i in $(seq 1 24); do
            if gh api "repos/${{ github.repository }}/git/refs/tags/${{ github.ref_name }}" >/dev/null 2>&1; then
              echo "Tag visible tras intento $i."
              exit 0
            fi
            echo "Intento $i: tag todavía no visible, esperando..."
            sleep 10
          done
          echo "El tag no quedó visible tras 4 minutos -- seguimos igual."

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: "Mercalin ${{ github.ref_name }}"
          draft: true
          prerelease: false
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            latest.json
