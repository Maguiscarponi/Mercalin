name: Publicar actualización

# Se dispara al subir un tag de versión (ej: git tag v1.0.1 && git push origin v1.0.1).
# Compila el instalador de Windows, lo firma con la clave de actualizaciones y publica
# todo como un GitHub Release -- incluyendo latest.json, que es lo que la app ya
# instalada consulta para saber si hay una versión nueva (ver src/stores/updater.ts).
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Punto Simple POS ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
